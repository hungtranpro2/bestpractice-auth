# Example same-host production topology:
# https://app.example.com/*     -> Next.js
# https://app.example.com/v1/*  -> NestJS
#
# The NestJS API sets a host-only __Host-session cookie. Since the browser sees
# the public app.example.com host for both paths, that same cookie is sent to
# Next.js for SSR and to /v1 for direct browser-to-NestJS API calls.

server {
    listen 443 ssl http2;
    server_name app.example.com;

    # Configure ssl_certificate / ssl_certificate_key for your deployment.

    location ^~ /v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
