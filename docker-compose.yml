services:
  postgres:
    image: postgres:17-alpine
    container_name: bestpractice-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bestpractice_auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth_dev_only
    ports:
      - "5432:5432"
    volumes:
      - bestpractice_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d bestpractice_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bestpractice_auth_postgres_data: